name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the checks and redeploy main from the Actions tab.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/backend
    env:
      DJANGO_SECRET_KEY: ci-secret
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/frontend/.nvmrc
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run prettify:check
      - run: npm run typecheck
      - run: npm run build

  # Ship main to Google Cloud once the checks pass. One-time setup and how it
  # works: website/DEPLOY.md.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Let a deploy finish before the next one starts.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-west1
      REPO: us-west1-docker.pkg.dev/caltreat/ctr
      API_URL: https://ctr-api-487080838958.us-west1.run.app
      SQL_INSTANCE: caltreat:us-west1:ctr-db
      DJANGO_ENV: POSTGRES_HOST=/cloudsql/caltreat:us-west1:ctr-db,POSTGRES_DB=ctr,POSTGRES_USER=ctr
      DJANGO_SECRETS: DJANGO_SECRET_KEY=django-secret-key:latest,POSTGRES_PASSWORD=postgres-password:latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: caltreat
          workload_identity_provider: projects/487080838958/locations/global/workloadIdentityPools/github/providers/ctr-repo
          service_account: ctr-deploy@caltreat.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3

      - name: Build the Django image
        uses: docker/build-push-action@v6
        with:
          context: website/backend
          push: true
          tags: ${{ env.REPO }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the Next.js image
        uses: docker/build-push-action@v6
        with:
          context: website/frontend
          push: true
          build-args: API_URL=${{ env.API_URL }}
          tags: ${{ env.REPO }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Before the new code goes live, so migrations must suit the old code too.
      - name: Run migrations
        run: >
          gcloud run jobs deploy ctr-manage
          --region=$REGION
          --image=$REPO/api:$GITHUB_SHA
          --service-account=ctr-api@caltreat.iam.gserviceaccount.com
          --set-cloudsql-instances=$SQL_INSTANCE
          --set-env-vars=$DJANGO_ENV
          --set-secrets=$DJANGO_SECRETS
          --command=python
          --args=manage.py,migrate
          --max-retries=0
          --execute-now
          --wait
      - name: Deploy Django
        run: >
          gcloud run deploy ctr-api
          --region=$REGION
          --image=$REPO/api:$GITHUB_SHA
          --service-account=ctr-api@caltreat.iam.gserviceaccount.com
          --set-cloudsql-instances=$SQL_INSTANCE
          --set-env-vars=$DJANGO_ENV,DJANGO_ALLOWED_HOSTS=${API_URL#https://}
          --set-secrets=$DJANGO_SECRETS
          --allow-unauthenticated
      - name: Deploy Next.js
        run: >
          gcloud run deploy ctr-web
          --region=$REGION
          --image=$REPO/web:$GITHUB_SHA
          --service-account=ctr-web@caltreat.iam.gserviceaccount.com
          --set-env-vars=API_URL=$API_URL
          --allow-unauthenticated

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.0
  hooks:
    - id: ruff-check
      args: [ --fix ]
      files: ^website/backend/
    - id: ruff-format
      files: ^website/backend/
- repo: local
  hooks:
    - id: prettify
      name: prettify
      entry: npm --prefix website/frontend run prettify
      language: system
      files: ^website/frontend/
      pass_filenames: false

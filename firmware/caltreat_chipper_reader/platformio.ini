; PlatformIO Project Configuration File
;
; Target: Elecrow CrowPanel Advanced 5" ESP32-P4 (chip rev v1.x)
;
; The official platformio/espressif32 platform has no ESP32-P4 support, so this
; uses the pioarduino fork (stable release, ESP-IDF 5.5.5). Pinned for reproducibility.
; Most chip/flash/PSRAM/LVGL settings live in sdkconfig.defaults.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; pioarduino installs its own platform, packages, toolchains and Python env
; (including its fork of PlatformIO Core) into core_dir, overwriting the official
; ones there. Use a dedicated core so it never touches the default ~/.platformio.
; (It can't live inside the project: the ESP-IDF builder breaks when the
; framework sits under PROJECT_DIR.)
core_dir = ~/.pioarduino

[env:crowpanel_p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; pre-rev3 ("ES") P4 silicon, matching CONFIG_ESP32P4_SELECTS_REV_LESS_V3
board = esp32-p4
framework = espidf

board_build.f_cpu = 360000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456

monitor_speed = 115200

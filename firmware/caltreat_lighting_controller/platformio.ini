; CalTreat lighting controller: Modbus TCP <-> GPIO bridge for the Waveshare
; RP2350-ETH (RP2350A, 4MB flash, CH9120 Ethernet). Uses the Pico 2 board
; definition with the board's own Pico SDK header.
;
; Upload (button or `pio run -t upload`) installs over USB, also on a blank
; chip. Network updates, host tools and tests: tools/README.md.
; Flash layout: partitions.json.

[env:app]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = picosdk
board_build.picosdk.board_header = waveshare_rp2350_eth.h
; one app partition (1920K)
board_upload.maximum_size = 1966080
; Firmware version, sealed into the image; LC_FW_VERSION=X.Y.Z overrides it
custom_fw_version = 0.6.4
extra_scripts = pre:scripts/build_image.py
; USB log (also lets picotool reset the running board); updated images run
; on trial until they buy themselves; picotool seal adds the end block
build_flags =
    -D PIO_STDIO_USB
    -D PICO_CRT0_IMAGE_TYPE_TBYB=1
    -D PICO_CRT0_INCLUDE_PICOBIN_END_BLOCK=0
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/upload.py" "$PICOTOOL" "$BUILD_DIR"

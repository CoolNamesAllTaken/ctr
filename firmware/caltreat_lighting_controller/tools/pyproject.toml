[project]
name = "lcctl"
version = "0.1.0"
description = "Host tools for the CalTreat lighting controller boards (Modbus TCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.8",
    "typer>=0.12",
]

[project.scripts]
lcctl = "lcctl.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ota'"   # OTA tests are slow: run them with -m ota
markers = [
    "ota: firmware update tests (slow, rebuild and reflash the board)",
]

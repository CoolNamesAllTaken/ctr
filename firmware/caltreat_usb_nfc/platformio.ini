; PlatformIO Project Configuration File
;
; RP2040-Zero bridging an RFID-RC522 (MFRC522) to USB, presenting itself as an
; NXP PN532 UART reader over USB CDC so existing software (libnfc, nfcpy,
; adafruit-circuitpython-pn532, NFCToolsGUI) can drive it.
;
; USB is the stock pico_stdio_usb setup: one CDC port (the PN532 protocol) plus
; the picotool reset interface. Opening the port at 1200 baud reboots into
; BOOTSEL, so `pio run -t upload` works without pressing the button.
; Debug printf goes to the UART on GPIO0 (TX), 115200 8N1.

[env:waveshare_rp2040_zero]
; Community platform that adds the native Raspberry Pi Pico SDK as a framework
; (the official platformio/raspberrypi only supports Arduino)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = picosdk
monitor_speed = 115200
build_flags =
    -I include
    ; stdio over USB (stock descriptors + reset handling) and over UART0. main.c
    ; disables the USB stdio driver so printf only goes to the UART.
    -D PIO_STDIO_USB
    -D PIO_STDIO_UART
    ; run tud_task() from the main loop only, not a background IRQ, since main.c
    ; talks to the CDC port directly
    -D PICO_STDIO_USB_ENABLE_IRQ_BACKGROUND_TASK=0
    ; distinct product name / PID from a plain SDK stdio device (no spaces:
    ; the platform passes flags to the boot2 assembler step unquoted)
    -D USBD_PRODUCT=\"RC522-PN532-Bridge\"
    -D USBD_PID=0x000B
    ; room for a full PN532 frame (SDK default is 64)
    -D CFG_TUD_CDC_RX_BUFSIZE=256
    -D CFG_TUD_CDC_TX_BUFSIZE=256

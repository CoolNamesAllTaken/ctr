; PlatformIO Project Configuration File
;
; RP2040-Zero bridging an RFID-RC522 (MFRC522) to USB, presenting itself as an
; NXP PN532 UART reader over USB CDC so existing software (libnfc, nfcpy,
; adafruit-circuitpython-pn532, NFCToolsGUI) can drive it.
;
; USB layout: composite device with two CDC interfaces.
;   CDC0 -> debug console (pico stdio printf)
;   CDC1 -> PN532 protocol port (binary)
; Plus the pico vendor reset interface so picotool / 1200-baud reboot still works.

[env:waveshare_rp2040_zero]
platform = raspberrypi
board = waveshare_rp2040_zero
framework = picosdk
monitor_speed = 115200
build_flags =
    -I include
    ; keep TinyUSB + pico stdio-over-USB compiled in (the picosdk builder only
    ; builds TinyUSB when PIO_STDIO_USB is defined)
    -D PIO_STDIO_USB
    ; we supply our own descriptors (2x CDC) instead of the SDK's single-CDC set
    -D PICO_STDIO_USB_USE_DEFAULT_DESCRIPTORS=0
    ; TinyUSB includes our config (CFG_TUD_CDC=2) instead of the SDK's
    -D CFG_TUSB_CONFIG_FILE=\"app_tusb_config.h\"
    ; don't block startup waiting for a host to open the debug CDC
    -D PICO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=0
    ; our descriptors are a plain 2x CDC composite; drop the SDK's extra reset
    ; interfaces (flash via the BOOTSEL button on the RP2040-Zero instead). The
    ; magic-baud/vendor reset paths pull in descriptors/macros that assume the
    ; SDK's own single-CDC layout, so we turn them off.
    -D PICO_STDIO_USB_ENABLE_RESET_VIA_VENDOR_INTERFACE=0
    -D PICO_STDIO_USB_ENABLE_RESET_VIA_BAUD_RATE=0

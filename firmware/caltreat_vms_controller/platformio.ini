; Caltrain VMS test firmware - Waveshare ESP32-S3-RGB-Matrix (SKU 34422) + 4x Waveshare RGB-Matrix-P5-64x32.
;
; Plain ESP-IDF 5.5.x (no Arduino), via the pioarduino fork of the espressif32 platform, as in
; caltreat_chipper_reader. Chip, flash, PSRAM and console settings live in sdkconfig.defaults; components
; in src/idf_component.yml.
;
; PlatformIO has no Waveshare profile, so the generic S3 DevKitC-1 profile is overridden to match the
; module, ESP32-S3-WROOM-2-N32R16V. esptool reports it as: ESP32-S3 (QFN56) rev v0.2, 32 MB Macronix
; flash (c2/8039, eFuse flash type: octal) and 16 MB embedded octal PSRAM (AP_1v8).

[platformio]
; pioarduino installs its own platform, packages, toolchains and Python env into core_dir, overwriting
; the official ones there. Use a dedicated core so it never touches the default ~/.platformio.
core_dir = ~/.pioarduino

[env:waveshare_s3_rgb_matrix]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 6553600       ; ota_0 in partitions.csv (0x640000)

[project]
name = "ctr-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ctr.settings"
python_files = "test_*.py"

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, flake8-django
select = ["E", "F", "I", "UP", "B", "DJ"]
# Line length is the formatter's job
ignore = ["E501"]

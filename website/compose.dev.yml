name: ctr-dev

services:
  django:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    ports:
      - ${DJANGO_PORT:-8000}:8000
    env_file:
      - .env.dev
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python -u manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    # For EMPLOYEE_PASSPHRASE
    env_file:
      - .env.dev
    environment:
      API_URL: http://django:8000
    volumes:
      - ./frontend:/app
      # Keep the container's own installs/build output rather than the host's
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - django

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - postgres_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_volume:
  frontend_node_modules:
  frontend_next:
